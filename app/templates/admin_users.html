{% extends "base.html" %}
{% block title %}用户管理 - Breeze{% endblock %}
{% block content %}
<div class="section"><h2 style="font-size:1.4rem;font-weight:700;">👥 用户管理</h2></div>
<div class="table-container">
    <table>
        <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>注册时间</th><th>操作</th></tr></thead>
        <tbody>
        {% for u in users %}
        <tr>
            <td style="color:var(--text-muted)">{{ u.id }}</td>
            <td><strong>{{ u.username }}</strong></td>
            <td><span class="badge {% if u.role == 'admin' %}badge-rating{% else %}badge-genre{% endif %}">{{ u.role }}</span></td>
            <td style="color:var(--text-muted)">{{ u.created_at[:16] }}</td>
            <td>
                <form method="POST" action="{{ url_for('admin_change_role', user_id=u.id) }}" style="display:inline;">
                    <select name="role" onchange="this.form.submit()" style="padding:6px 10px;background:var(--bg-secondary);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:var(--text-primary);font-size:0.8rem;">
                        <option value="user" {% if u.role == 'user' %}selected{% endif %}>user</option>
                        <option value="admin" {% if u.role == 'admin' %}selected{% endif %}>admin</option>
                    </select>
                </form>
                {% if u.role != 'admin' %}
                <form method="POST" action="{{ url_for('admin_delete_user', user_id=u.id) }}" style="display:inline;" onsubmit="return confirm('确定删除该用户？')">
                    <button class="btn btn-danger btn-sm">删除</button>
                </form>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
