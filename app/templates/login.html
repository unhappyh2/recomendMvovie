{% extends "base.html" %}
{% block title %}登录 - Breeze{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>欢迎回来</h2>
        <form method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">登 录</button>
        </form>
        <div class="auth-links">
            还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
        </div>
        <div class="auth-hint">
            管理员: admin / admin123<br>
            数据集用户: user_1 ~ user_943 / 密码: 123456<br>
            <span style="color:var(--accent-light);">登录 user_1 即可看该用户的个性化推荐</span>
        </div>
    </div>
</div>
{% endblock %}
