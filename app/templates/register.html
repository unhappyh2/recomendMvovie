{% extends "base.html" %}
{% block title %}注册 - Breeze{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>创建账号</h2>
        <form method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="至少3个字符" required minlength="3">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="至少4个字符" required minlength="4">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" name="confirm_password" placeholder="再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">注 册</button>
        </form>
        <div class="auth-links">
            已有账号？<a href="{{ url_for('login') }}">返回登录</a>
        </div>
    </div>
</div>
{% endblock %}
