{% extends "base.html" %}
{% block title %}电影管理 - Breeze{% endblock %}
{% block content %}
<div class="section"><h2 style="font-size:1.4rem;font-weight:700;">🎬 电影管理 <span style="color:var(--text-muted);font-weight:400;">({{ movies|length }})</span></h2></div>
<div class="table-container">
    <table>
        <thead><tr><th>ID</th><th>电影</th><th>类型</th><th></th></tr></thead>
        <tbody>
        {% for m in movies %}
        <tr>
            <td style="color:var(--text-muted)">#{{ m.movie_id }}</td>
            <td><a href="{{ url_for('movie_detail', movie_id=m.movie_id) }}">{{ m.title }}</a></td>
            <td><span class="badge badge-genre">{{ m.genres.replace('|', ' · ') }}</span></td>
            <td>
                <a href="{{ url_for('movie_detail', movie_id=m.movie_id) }}" class="btn btn-outline btn-sm">查看</a>
                <form method="POST" action="{{ url_for('admin_delete_movie', movie_id=m.movie_id) }}" style="display:inline;" onsubmit="return confirm('确定清理该电影的所有评分和评论？')">
                    <button class="btn btn-danger btn-sm">清理数据</button>
                </form>
            </td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
