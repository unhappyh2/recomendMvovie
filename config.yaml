# RecBole Configuration for DiffuRec Model
# 数据集配置
data_path: dataset/
dataset: ml-100k
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, rating, timestamp]
  user: [user_id, age, gender, occupation]
  item: [item_id, title, genres]

# 只保留高评分交互作为正反馈，避免低分电影进入推荐正样本
val_interval:
  rating: "[4,inf)"
filter_inter_by_user_or_item: True

# 训练配置
epochs: 200
train_batch_size: 512
eval_batch_size: 1024
eval_step: 50
stopping_step: 5
valid_metric: Recall@10
MAX_ITEM_LIST_LENGTH: 50
train_neg_sample_args: ~
loss_type: CE
learner: adam
weight_decay: 0.0
eval_args:
  split: {'LS': 'valid_and_test'}
  group_by: user
  order: TO
  mode: full

# 通用模型超参数
embedding_size: 128

# DiffuRec 扩散序列模型参数
diffurec_num_blocks: 4
diffurec_attention_heads: 4
diffurec_dropout: 0.1
diffurec_emb_dropout: 0.3
diffurec_lambda_uncertainty: 0.001
diffurec_rescale_timesteps: True
schedule_sampler_name: lossaware
diffusion_steps: 16
diffusion_schedule: trunc_lin

# 优化器
learning_rate: 1e-3

# 其他
seed: 1997
device: cpu
topk: [10]
show_progress: True

# 保存路径
checkpoint_dir: saved/
