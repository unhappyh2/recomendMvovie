# RecBole Configuration for DiffuRec Model
# 数据集配置
data_path: dataset/
dataset: ml-100k
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, rating, timestamp]
  user: [user_id, age, gender, occupation]
  item: [item_id, title, genres]

# 只保留高评分交互作为正反馈，避免低分电影进入推荐正样本
val_interval:
  rating: "[4,inf)"
filter_inter_by_user_or_item: True

# 训练配置
epochs: 100
train_batch_size: 2048
eval_batch_size: 4096
valid_metric: Recall@10
eval_args:
  split: {'RS': [0.8, 0.1, 0.1]}
  group_by: user
  order: RO
  mode: full

# 通用模型超参数
embedding_size: 128

# DiffuRec 扩散序列模型参数
diffurec_max_len: 50
diffurec_num_blocks: 4
diffurec_attention_heads: 4
diffurec_dropout: 0.1
diffurec_emb_dropout: 0.3
diffurec_lambda_uncertainty: 0.001
diffurec_rescale_timesteps: True
diffusion_steps: 32
diffusion_beta_start: 1e-4
diffusion_beta_end: 0.02
diffusion_schedule: trunc_lin
diffusion_hidden_dims: [256, 128]
diffusion_lr: 1e-4

# 优化器
learning_rate: 1e-3

# 其他
seed: 42
device: cpu
topk: [10, 20, 50]
show_progress: True

# 保存路径
checkpoint_dir: saved/
