# RecBole-loaded dataset configuration for DiffuRec reproduction
data_path: dataset/
dataset: ml-100k
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, rating, timestamp]
  user: [user_id, age, gender, occupation]
  item: [item_id, title, genres]

# official DiffuRec does not rely on an extra high-rating filter here
filter_inter_by_user_or_item: True

# sequence setting
MAX_ITEM_LIST_LENGTH: 50
train_neg_sample_args: ~
loss_type: CE

# training
epochs: 500
train_batch_size: 512
eval_batch_size: 512
eval_interval: 20
patience: 5
valid_metric: Recall@10
learning_rate: 0.001
weight_decay: 0.0
decay_step: 100
gamma: 0.1

# official-style DiffuRec parameters
hidden_size: 128
dropout: 0.1
emb_dropout: 0.3
num_blocks: 4
attention_heads: 4
diffusion_steps: 32
lambda_uncertainty: 0.001
noise_schedule: trunc_lin
schedule_sampler_name: lossaware
rescale_timesteps: True

# misc
seed: 1997
device: cuda
topk: [5, 10, 20]
checkpoint_dir: saved/
