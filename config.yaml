# RecBole Configuration for LightGCN Model
# 数据集配置
data_path: dataset/
dataset: ml-100k
USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
load_col:
  inter: [user_id, item_id, rating, timestamp]
  user: [user_id, age, gender, occupation]
  item: [item_id, title, genres]

# 训练配置
epochs: 200
train_batch_size: 2048
eval_batch_size: 4096
valid_metric: Recall@10
eval_args:
  split: {'RS': [0.8, 0.1, 0.1]}
  group_by: user
  order: RO
  mode: full

# 模型超参数
embedding_size: 64
n_layers: 3
reg_weight: 1e-4

# 预留 DDPM 扩散模型参数（当前 LightGCN 训练路径未启用）
diffusion_steps: 20
diffusion_beta_start: 1e-4
diffusion_beta_end: 0.02
diffusion_schedule: linear
diffusion_hidden_dims: [256, 128]
diffusion_lr: 1e-4

# 优化器
learning_rate: 1e-3

# 其他
seed: 42
device: cpu
topk: [10, 20, 50]
show_progress: True

# 保存路径
checkpoint_dir: saved/
